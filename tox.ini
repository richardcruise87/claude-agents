[tox]
envlist = py312, pep8
skipsdist = true

[testenv]
deps =
    pytest>=7
    pytest-asyncio
    pytest-mock
setenv =
    PYTHONPATH = {toxinidir}/agents_lib:{toxinidir}/bug-triage-agent:{toxinidir}/code-review-agent:{toxinidir}/ci-failure-agent:{toxinidir}/bug-reproduction-agent:{toxinidir}/devstack-test-agent
commands =
    pytest {posargs:tests/}

[testenv:unit]
deps = {[testenv]deps}
setenv = {[testenv]setenv}
commands = pytest tests/unit/ -v {posargs}

[testenv:functional]
deps = {[testenv]deps}
setenv = {[testenv]setenv}
commands = pytest tests/functional/ -v {posargs}

[testenv:pep8]
deps =
    flake8>=6
    flake8-bugbear
commands =
    flake8 \
        agents_lib/agents_lib \
        bug-triage-agent \
        code-review-agent \
        ci-failure-agent \
        bug-reproduction-agent \
        devstack-test-agent \
        tests

[flake8]
max-line-length = 120
extend-ignore =
    E203,
    W503,
    # module level import not at top — common when sys.path is set first
    E402
per-file-ignores =
    # __init__.py re-exports: imported but unused
    agents_lib/agents_lib/__init__.py:F401
exclude =
    .tox,
    .venv,
    __pycache__,
    *.egg-info,
    */prompts/__init__.py
