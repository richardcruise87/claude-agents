[tox]
envlist = py312, pep8
skipsdist = true

[testenv]
deps =
    pytest>=7
    pytest-asyncio
    pytest-mock
setenv =
    PYTHONPATH = {toxinidir}/agents_lib:{toxinidir}/bug-triage-agent:{toxinidir}/code-review-agent:{toxinidir}/ci-failure-agent:{toxinidir}/bug-reproduction-agent:{toxinidir}/devstack-test-agent:{toxinidir}/jira-triage-agent:{toxinidir}/fix-proposal-agent:{toxinidir}/fix-verification-agent:{toxinidir}/backport-agent
commands =
    pytest {posargs:tests/}

[testenv:unit]
deps =
    {[testenv]deps}
    openai
setenv = {[testenv]setenv}
commands = pytest tests/unit/ -v {posargs}

[testenv:functional]
deps = {[testenv]deps}
setenv = {[testenv]setenv}
commands = pytest tests/functional/ -v {posargs}

[testenv:pep8]
deps =
    flake8>=6
    flake8-bugbear
    pylint
setenv =
    PYTHONPATH = {toxinidir}/agents_lib:{toxinidir}/bug-triage-agent:{toxinidir}/code-review-agent:{toxinidir}/ci-failure-agent:{toxinidir}/bug-reproduction-agent:{toxinidir}/devstack-test-agent:{toxinidir}/jira-triage-agent:{toxinidir}/fix-proposal-agent:{toxinidir}/fix-verification-agent:{toxinidir}/backport-agent
commands =
    flake8 \
        agents_lib/agents_lib \
        bug-triage-agent \
        code-review-agent \
        ci-failure-agent \
        bug-reproduction-agent \
        devstack-test-agent \
        jira-triage-agent \
        fix-proposal-agent \
        fix-verification-agent \
        backport-agent \
        tests
    pylint --rcfile={toxinidir}/.pylintrc \
        agents_lib/agents_lib \
        bug-triage-agent/bug_triage_agent.py \
        bug-triage-agent/bug_tracker.py \
        code-review-agent/octavia_review_agent.py \
        code-review-agent/review_single_change.py \
        code-review-agent/patchset_tracker.py \
        ci-failure-agent/ci_failure_agent.py \
        ci-failure-agent/analyze_ci_failure.py \
        ci-failure-agent/failure_tracker.py \
        ci-failure-agent/zuul_client.py \
        bug-reproduction-agent/bug_reproduction_agent.py \
        bug-reproduction-agent/reproduction_tracker.py \
        bug-reproduction-agent/triage_parser.py \
        bug-reproduction-agent/script_generator.py \
        bug-reproduction-agent/script_executor.py \
        bug-reproduction-agent/report_generator.py \
        devstack-test-agent/devstack_test_agent.py \
        devstack-test-agent/feedback_parser.py \
        devstack-test-agent/report_validator.py \
        devstack-test-agent/review_parser.py \
        jira-triage-agent/jira_triage_agent.py \
        jira-triage-agent/jira_client.py \
        jira-triage-agent/issue_tracker.py \
        jira-triage-agent/config.py \
        fix-proposal-agent/fix_proposal_agent.py \
        fix-proposal-agent/proposal_tracker.py \
        fix-proposal-agent/launchpad_feedback.py \
        fix-verification-agent/fix_verification_agent.py \
        fix-verification-agent/verification_tracker.py \
        fix-verification-agent/patch_applicator.py \
        fix-verification-agent/failure_analyser.py \
        backport-agent/backport_monitor.py \
        backport-agent/backport_tracker.py \
        backport-agent/backport_review_agent.py

[testenv:bandit]
deps = bandit[toml]
setenv =
    PYTHONPATH = {toxinidir}/agents_lib
commands =
    bandit -r \
        agents_lib/agents_lib \
        bug-triage-agent \
        code-review-agent \
        ci-failure-agent \
        bug-reproduction-agent \
        devstack-test-agent \
        jira-triage-agent \
        fix-proposal-agent \
        fix-verification-agent \
        backport-agent \
        -ll \
        --exclude \
            .tox,.venv,venv,__pycache__,tests,scripts,\
            bug-reproduction-agent/.venv,bug-reproduction-agent/venv


[flake8]
max-line-length = 120
extend-ignore =
    E203,
    W503,
    # module level import not at top — common when sys.path is set first
    E402
per-file-ignores =
    # __init__.py re-exports: imported but unused
    agents_lib/agents_lib/__init__.py:F401
exclude =
    .tox,
    .venv,
    __pycache__,
    *.egg-info,
    */prompts/__init__.py
